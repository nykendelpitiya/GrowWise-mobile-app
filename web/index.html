<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="GrowWise mobile app">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="growwise_mobile_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>growwise_mobile_app</title>
  <link rel="manifest" href="manifest.json">

  <!-- 🔥 Firebase Messaging + Service Worker Fix -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async function () {
        try {
          // 🔥 Register Firebase Messaging SW
          const registration = await navigator.serviceWorker.register('/firebase-messaging-sw.js');

          console.log('✅ Firebase SW registered:', registration);

          // 🔥 Wait until active (IMPORTANT FIX)
          await navigator.serviceWorker.ready;

          console.log('🔥 Service Worker is ACTIVE');

        } catch (error) {
          console.error('❌ SW registration failed:', error);
        }
      });
    }
  </script>

</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
